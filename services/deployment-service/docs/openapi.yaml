openapi: 3.0.3

info:
  title: CloudForge AI Deployment Service API
  description: |
    REST API for managing application deployments in CloudForge AI.

    The service manages deployment records, environments,
    container images, Git commit references, namespaces,
    and deployment lifecycle statuses.
  version: 1.0.0
  contact:
    name: CloudForge AI
    url: https://github.com/sufiyannadeem/cloudforge-ai

servers:
  - url: http://localhost:8082
    description: Local development server

tags:
  - name: Health
    description: Service health endpoints
  - name: Deployments
    description: Deployment management endpoints

paths:
  /health:
    get:
      tags:
        - Health
      summary: Check service health
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                service: deployment-service
                status: ok

  /api/v1/deployments:
    post:
      tags:
        - Deployments
      summary: Create a deployment
      operationId: createDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeploymentRequest"
            example:
              project_id: 11111111-1111-1111-1111-111111111111
              environment: development
              image: nginx:1.27-alpine
              git_commit_sha: abcdef1234567
              namespace: cloudforge-dev
      responses:
        "201":
          description: Deployment created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

    get:
      tags:
        - Deployments
      summary: List deployments
      operationId: listDeployments
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Deployments retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/deployments/{id}:
    parameters:
      - $ref: "#/components/parameters/DeploymentID"

    get:
      tags:
        - Deployments
      summary: Get a deployment
      operationId: getDeployment
      responses:
        "200":
          description: Deployment retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      tags:
        - Deployments
      summary: Update a deployment
      operationId: updateDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeploymentRequest"
            example:
              status: queued
      responses:
        "200":
          description: Deployment updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Deployments
      summary: Delete a deployment
      operationId: deleteDeployment
      responses:
        "204":
          description: Deployment deleted successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    DeploymentID:
      name: id
      in: path
      required: true
      description: UUID of the deployment
      schema:
        type: string
        format: uuid
      example: 0cdec24e-05be-409f-86e2-ee127b2a95a7

    Limit:
      name: limit
      in: query
      required: false
      description: Number of deployments to return
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

    Offset:
      name: offset
      in: query
      required: false
      description: Number of deployments to skip
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0

  schemas:
    HealthResponse:
      type: object
      required:
        - service
        - status
      properties:
        service:
          type: string
          example: deployment-service
        status:
          type: string
          example: ok

    CreateDeploymentRequest:
      type: object
      required:
        - project_id
        - environment
        - image
        - git_commit_sha
        - namespace
      properties:
        project_id:
          type: string
          format: uuid
          description: ID of the associated project
        environment:
          type: string
          enum:
            - development
            - staging
            - production
        image:
          type: string
          minLength: 3
          description: Container image reference
          example: nginx:1.27-alpine
        git_commit_sha:
          type: string
          minLength: 7
          maxLength: 100
          description: Git commit SHA associated with the deployment
          example: abcdef1234567
        namespace:
          type: string
          minLength: 1
          maxLength: 100
          description: Kubernetes namespace
          example: cloudforge-dev

    UpdateDeploymentRequest:
      type: object
      minProperties: 1
      properties:
        environment:
          type: string
          enum:
            - development
            - staging
            - production
        image:
          type: string
          minLength: 3
        git_commit_sha:
          type: string
          minLength: 7
          maxLength: 100
        namespace:
          type: string
          minLength: 1
          maxLength: 100
        status:
          type: string
          enum:
            - pending
            - queued
            - running
            - succeeded
            - failed
            - cancelled

    Deployment:
      type: object
      required:
        - id
        - project_id
        - environment
        - image
        - git_commit_sha
        - namespace
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project_id:
          type: string
          format: uuid
        environment:
          type: string
          enum:
            - development
            - staging
            - production
        image:
          type: string
          example: nginx:1.27-alpine
        git_commit_sha:
          type: string
          example: abcdef1234567
        namespace:
          type: string
          example: cloudforge-dev
        status:
          type: string
          enum:
            - pending
            - queued
            - running
            - succeeded
            - failed
            - cancelled
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    DeploymentListResponse:
      type: object
      required:
        - items
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Deployment"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: deployment not found

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: invalid request

    NotFound:
      description: Deployment not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: deployment not found

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: internal server error
