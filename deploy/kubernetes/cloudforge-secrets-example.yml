---
# =============================================================================
# CloudForge AI — Kubernetes Secret and EKS Workload Identity Examples
# =============================================================================
# IMPORTANT: This file is a CONFIGURATION EXAMPLE only.
#   - Do NOT apply this file directly with real credentials.
#   - Do NOT commit real secret values to source control.
#   - Populate secrets using the instructions below before applying.
#
# This file is listed in .gitignore and must never be committed with real values.
#
# How to use
# ----------
# 1. Create a .env.prod file (not committed) with real runtime values.
# 2. Run the helper script to materialise and apply:
#
#   chmod +x scripts/apply-k8s-secrets.sh
#   ./scripts/apply-k8s-secrets.sh
#
# =============================================================================

# -----------------------------------------------------------------------------
# Namespace
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: cloudforge
  labels:
    app.kubernetes.io/managed-by: cloudforge

---
# -----------------------------------------------------------------------------
# Independent caller/receiver keys. Replace each placeholder with a unique secret.
apiVersion: v1
kind: Secret
metadata:
  name: cloudforge-frontend-project
  namespace: cloudforge
type: Opaque
stringData:
  CLOUDFORGE_FRONTEND_PROJECT_KEY: "replace-with-an-independent-key"

---
apiVersion: v1
kind: Secret
metadata:
  name: cloudforge-frontend-infrastructure
  namespace: cloudforge
type: Opaque
stringData:
  CLOUDFORGE_FRONTEND_INFRASTRUCTURE_KEY: "replace-with-an-independent-key"

---
apiVersion: v1
kind: Secret
metadata:
  name: cloudforge-frontend-deployment
  namespace: cloudforge
type: Opaque
stringData:
  CLOUDFORGE_FRONTEND_DEPLOYMENT_KEY: "replace-with-an-independent-key"

---
apiVersion: v1
kind: Secret
metadata:
  name: cloudforge-frontend-aiops
  namespace: cloudforge
type: Opaque
stringData:
  CLOUDFORGE_FRONTEND_AIOPS_KEY: "replace-with-an-independent-key"

---
apiVersion: v1
kind: Secret
metadata:
  name: cloudforge-frontend-finops
  namespace: cloudforge
type: Opaque
stringData:
  CLOUDFORGE_FRONTEND_FINOPS_KEY: "replace-with-an-independent-key"

---
apiVersion: v1
kind: Secret
metadata:
  name: cloudforge-aiops-deployment
  namespace: cloudforge
type: Opaque
stringData:
  CLOUDFORGE_AIOPS_DEPLOYMENT_KEY: "replace-with-an-independent-key"

---
apiVersion: v1
kind: Secret
metadata:
  name: cloudforge-alertmanager-identity
  namespace: cloudforge
type: Opaque
stringData:
  CLOUDFORGE_ALERTMANAGER_KEY: "replace-with-an-independent-key"

---
# -----------------------------------------------------------------------------
# PostgreSQL credentials
# Consumed by: project-service, infrastructure-service, deployment-service,
#              aiops-service (via DATABASE_URL)
# FinOps project attribution uses a separate read-only database account.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: cloudforge-postgres-credentials
  namespace: cloudforge
  labels:
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
  DATABASE_URL: "postgres://cloudforge:REPLACE_ME@cloudforge-postgres:5432/cloudforge?sslmode=require"

---
# -----------------------------------------------------------------------------
# Frontend server-side credentials
# Consumed by: frontend container (Node.js server — NEVER exposed to the browser)
# Variable: CLOUDFORGE_SESSION_SECRET (CSRF HMAC key)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: cloudforge-frontend-credentials
  namespace: cloudforge
  labels:
    app.kubernetes.io/component: frontend
type: Opaque
stringData:
  CLOUDFORGE_SESSION_SECRET: "REPLACE_ME_min_32_chars"

---
# -----------------------------------------------------------------------------
# Observability SMTP credentials
# Consumed by: alertmanager (grafana SMTP optional — grafana.ini can reference env vars)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: cloudforge-observability-smtp
  namespace: cloudforge
  labels:
    app.kubernetes.io/component: observability
type: Opaque
stringData:
  ALERTMANAGER_SMTP_USER: "REPLACE_ME"
  ALERTMANAGER_SMTP_PASSWORD: "REPLACE_ME"
  GRAFANA_SMTP_USER: "REPLACE_ME"
  GRAFANA_SMTP_PASSWORD: "REPLACE_ME"

---
# =============================================================================
# project-service Deployment
# Secret injection: DATABASE_URL only (no internal token — protected by gateway)
# IRSA annotation: requires IAM role with no Secrets Manager access (no AWS calls)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-service
  namespace: cloudforge
  labels:
    app: project-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project-service
  template:
    metadata:
      labels:
        app: project-service
    spec:
      serviceAccountName: cloudforge-project-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: project-service
          image: cloudforge-project-service:prod
          securityContext:
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "production"
            - name: SERVER_PORT
              value: "8080"
            - name: CLOUDFORGE_FRONTEND_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudforge-frontend-project
                  key: CLOUDFORGE_FRONTEND_PROJECT_KEY
          envFrom:
            - secretRef:
                name: cloudforge-postgres-credentials
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
# =============================================================================
# infrastructure-service Deployment
# Secret injection: scoped service identity keys and DATABASE_URL
# IRSA annotation: requires IAM role for S3 (Terraform state) + STS assume role
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrastructure-service
  namespace: cloudforge
  labels:
    app: infrastructure-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: infrastructure-service
  template:
    metadata:
      labels:
        app: infrastructure-service
    spec:
      serviceAccountName: cloudforge-infrastructure-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: infrastructure-service
          image: cloudforge-infrastructure-service:prod
          securityContext:
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8081
          env:
            - name: HOME
              value: /tmp
            - name: CHECKPOINT_DISABLE
              value: "1"
            - name: APP_ENV
              value: "production"
            - name: SERVER_PORT
              value: "8081"
            - name: TERRAFORM_STATE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: cloudforge-terraform
                  key: TERRAFORM_STATE_BUCKET
            - name: TERRAFORM_STATE_REGION
              valueFrom:
                configMapKeyRef:
                  name: cloudforge-terraform
                  key: TERRAFORM_STATE_REGION
                  optional: true
            - name: TERRAFORM_PROVISIONER_ROLE_ARN
              valueFrom:
                configMapKeyRef:
                  name: cloudforge-terraform
                  key: TERRAFORM_PROVISIONER_ROLE_ARN
            - name: AWS_REGION
              value: "eu-west-1"
            - name: CLOUDFORGE_FRONTEND_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudforge-frontend-infrastructure
                  key: CLOUDFORGE_FRONTEND_INFRASTRUCTURE_KEY
          envFrom:
            - secretRef:
                name: cloudforge-postgres-credentials
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
            - name: terraform-workspaces
              mountPath: /var/lib/cloudforge/terraform
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 2Gi
        - name: terraform-workspaces
          persistentVolumeClaim:
            claimName: cloudforge-terraform-workspaces

---
# =============================================================================
# deployment-service Deployment
# Secret injection: scoped service identity keys and DATABASE_URL
# The in-cluster deployment service uses a Kubernetes ServiceAccount and project RoleBindings.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-service
  namespace: cloudforge
  labels:
    app: deployment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deployment-service
  template:
    metadata:
      labels:
        app: deployment-service
    spec:
      serviceAccountName: cloudforge-deployment-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: deployment-service
          image: cloudforge-deployment-service:prod
          securityContext:
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8082
          env:
            - name: HOME
              value: /tmp
            - name: APP_ENV
              value: "production"
            - name: SERVER_PORT
              value: "8082"
            - name: DEPLOYMENT_EXECUTOR
              value: "kubernetes"
            - name: PROMETHEUS_URL
              valueFrom:
                configMapKeyRef:
                  name: cloudforge-observability
                  key: PROMETHEUS_URL
                  optional: true
            - name: KUBERNETES_NAMESPACE
              value: "default"
            - name: AWS_REGION
              value: "eu-west-1"
            - name: CLOUDFORGE_FRONTEND_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudforge-frontend-deployment
                  key: CLOUDFORGE_FRONTEND_DEPLOYMENT_KEY
            - name: CLOUDFORGE_AIOPS_DEPLOYMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudforge-aiops-deployment
                  key: CLOUDFORGE_AIOPS_DEPLOYMENT_KEY
          envFrom:
            - secretRef:
                name: cloudforge-postgres-credentials
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 2Gi

---
# =============================================================================
# finops-service Deployment
# Secret injection: frontend identity key and optional project attribution DSN
# IRSA annotation: requires IAM read access for Cost Explorer, CloudWatch and EC2 attribution
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-service
  namespace: cloudforge
  labels:
    app: finops-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finops-service
  template:
    metadata:
      labels:
        app: finops-service
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/cloudforge-finops-service"
    spec:
      serviceAccountName: cloudforge-finops-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: finops-service
          image: cloudforge-finops-service:prod
          securityContext:
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8091
          env:
            - name: APP_ENV
              value: "production"
            - name: AWS_REGION
              value: "eu-west-1"
            - name: FINOPS_AUDIT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloudforge-finops-audit-db
                  key: FINOPS_AUDIT_DATABASE_URL
                  optional: true
            - name: FINOPS_PROJECT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloudforge-finops-project-db
                  key: FINOPS_PROJECT_DATABASE_URL
                  optional: true
            - name: FINOPS_ALLOWED_ROLES
              value: "platform-engineer,devops,sre,admin"
            - name: CLOUDFORGE_FRONTEND_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudforge-frontend-finops
                  key: CLOUDFORGE_FRONTEND_FINOPS_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
# =============================================================================
# aiops-service Deployment
# Secret injection: scoped service identity keys and DATABASE_URL
# IRSA annotation: requires IAM role for Bedrock (if AI_PROVIDER=bedrock) + CloudWatch
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-service
  namespace: cloudforge
  labels:
    app: aiops-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiops-service
  template:
    metadata:
      labels:
        app: aiops-service
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/cloudforge-aiops-service"
    spec:
      serviceAccountName: cloudforge-aiops-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: aiops-service
          image: cloudforge-aiops-service:prod
          securityContext:
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8090
          env:
            - name: APP_ENV
              value: "production"
            - name: AWS_REGION
              value: "eu-west-1"
            - name: AI_PROVIDER
              value: "bedrock"
            - name: CLOUDFORGE_FRONTEND_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudforge-frontend-aiops
                  key: CLOUDFORGE_FRONTEND_AIOPS_KEY
            - name: CLOUDFORGE_AIOPS_DEPLOYMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudforge-aiops-deployment
                  key: CLOUDFORGE_AIOPS_DEPLOYMENT_KEY
            - name: CLOUDFORGE_ALERTMANAGER_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudforge-alertmanager-identity
                  key: CLOUDFORGE_ALERTMANAGER_KEY
          envFrom:
            - secretRef:
                name: cloudforge-postgres-credentials
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

---
# =============================================================================
# frontend Deployment
# Secret injection: all frontend credentials — server-side only, never browser
# Frontend receives one key for each backend audience.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cloudforge
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: cloudforge-frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: frontend
          image: cloudforge-frontend:prod
          securityContext:
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_APP_NAME
              value: "CloudForge AI"
            - name: NEXT_PUBLIC_APP_ENV
              value: "production"
            - name: CLOUDFORGE_AUTH_COOKIE_SECURE
              value: "true"
            - name: PROJECT_SERVICE_URL
              value: "http://project-service:8080"
            - name: INFRASTRUCTURE_SERVICE_URL
              value: "http://infrastructure-service:8081"
            - name: DEPLOYMENT_SERVICE_URL
              value: "http://deployment-service:8082"
            - name: AIOPS_SERVICE_URL
              value: "http://aiops-service:8090"
            - name: FINOPS_SERVICE_URL
              value: "http://finops-service:8091"
          envFrom:
            - secretRef:
                name: cloudforge-frontend-project
            - secretRef:
                name: cloudforge-frontend-infrastructure
            - secretRef:
                name: cloudforge-frontend-deployment
            - secretRef:
                name: cloudforge-frontend-aiops
            - secretRef:
                name: cloudforge-frontend-finops
            # Frontend CSRF HMAC key
            - secretRef:
                name: cloudforge-frontend-credentials
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 2Gi
        - name: next-cache
          emptyDir:
            sizeLimit: 512Mi

---
# =============================================================================
# ServiceAccount definitions (one per workload for IRSA scope)
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudforge-project-service
  namespace: cloudforge
  annotations:
    # project-service makes no AWS API calls — no role-arn annotation needed
    {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudforge-infrastructure-service
  namespace: cloudforge
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/cloudforge-infrastructure-service-runtime"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudforge-deployment-service
  namespace: cloudforge
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/cloudforge-deployment-service"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudforge-finops-service
  namespace: cloudforge
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/cloudforge-finops-service"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudforge-aiops-service
  namespace: cloudforge
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/cloudforge-aiops-service"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudforge-frontend
  namespace: cloudforge
  annotations:
    # frontend makes no direct AWS API calls — no role-arn needed
    {}
