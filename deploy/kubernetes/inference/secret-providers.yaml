# No secretObjects: never sync into Kubernetes Secrets.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: ai-inference-auth, namespace: cloudforge}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "REPLACE_WITH_EXACT_INTERNAL_AUTH_SECRET_ARN"
        objectType: "secretsmanager"
        objectAlias: "request-key"
        filePermission: "0440"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: ai-inference-tls, namespace: cloudforge}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "REPLACE_WITH_EXACT_TLS_SECRET_ARN"
        objectType: "secretsmanager"
        jmesPath:
          - path: '"tls.crt"'
            objectAlias: "tls.crt"
            filePermission: "0440"
          - path: '"tls.key"'
            objectAlias: "tls.key"
            filePermission: "0440"
