# Replace PROJECT_UUID with the authorized CloudForge project's UUID.
# Apply only after approval, to the intended cluster and an existing namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudforge-deployer
  namespace: cf-PROJECT_UUID
rules:
  # Dynamic project Deployment names require create/patch; see README RBAC exception.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list"]
  # kubectl apply manages only project-local Services; see README RBAC exception.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudforge-deployer
  namespace: cf-PROJECT_UUID
subjects:
  - kind: ServiceAccount
    name: cloudforge-deployment-service
    namespace: cloudforge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudforge-deployer
