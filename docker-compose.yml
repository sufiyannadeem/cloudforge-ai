services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudforge
      POSTGRES_USER: cloudforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudforge -d cloudforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  project-service:
    build:
      context: ./services/project-service
      dockerfile: Dockerfile
    image: cloudforge-project-service:local
    container_name: cloudforge-project-service
    restart: unless-stopped
    environment:
      APP_ENV: production
      SERVER_PORT: "8080"
      DATABASE_URL: postgres://cloudforge:${POSTGRES_PASSWORD}@postgres:5432/cloudforge?sslmode=disable
      SHUTDOWN_TIMEOUT_SECONDS: "10"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  infrastructure-service:
    build:
      context: ./services/infrastructure-service
      dockerfile: Dockerfile

    image: cloudforge-infrastructure-service:local

    container_name: cloudforge-infrastructure-service

    restart: unless-stopped

    environment:
      APP_ENV: production
      SERVER_PORT: "8081"
      CLOUDFORGE_INTERNAL_API_TOKEN: ${CLOUDFORGE_INTERNAL_API_TOKEN:?Set CLOUDFORGE_INTERNAL_API_TOKEN in .env}

      DATABASE_URL: postgres://cloudforge:${POSTGRES_PASSWORD}@postgres:5432/cloudforge?sslmode=disable

      SHUTDOWN_TIMEOUT_SECONDS: "10"

      # Terraform execution
      TERRAFORM_BINARY: /usr/local/bin/terraform
      TERRAFORM_WORKSPACE_ROOT: /var/lib/cloudforge/terraform

      # Intentionally empty for local development.
      # Developer-created resources must not reuse the
      # CloudForge platform Terraform state.
      TERRAFORM_STATE_BUCKET: ""

      TERRAFORM_PLAN_TIMEOUT: "10m"
      TERRAFORM_APPLY_TIMEOUT: "30m"

      # AWS Credentials and Region configuration
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
      AWS_CONFIG_FILE: /home/appuser/.aws/config
      AWS_SHARED_CREDENTIALS_FILE: /home/appuser/.aws/credentials

    ports:
      - "127.0.0.1:8081:8081"

    volumes:
      - terraform_workspaces:/var/lib/cloudforge/terraform
      - ${HOME}/.aws:/home/appuser/.aws:ro

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8081/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  deployment-service:
    build:
      context: ./services/deployment-service
      dockerfile: Dockerfile
    image: cloudforge-deployment-service:local
    container_name: cloudforge-deployment-service
    restart: unless-stopped
    environment:
      APP_ENV: production
      SERVER_PORT: "8082"
      CLOUDFORGE_INTERNAL_API_TOKEN: ${CLOUDFORGE_INTERNAL_API_TOKEN:?Set CLOUDFORGE_INTERNAL_API_TOKEN in .env}
      DATABASE_URL: postgres://cloudforge:${POSTGRES_PASSWORD}@postgres:5432/cloudforge?sslmode=disable
      SHUTDOWN_TIMEOUT_SECONDS: "10"
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8082/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: cloudforge-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    depends_on:
      deployment-service:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.1
    container_name: cloudforge-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp.gmail.com:587"
      GF_SMTP_USER: ${GRAFANA_SMTP_USER}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_USER}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD}
      GF_SMTP_FROM_NAME: "CloudForge AI Grafana"
    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: cloudforge-alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"

    environment:
      ALERTMANAGER_SMTP_USER: ${ALERTMANAGER_SMTP_USER:-}
      ALERTMANAGER_SMTP_PASSWORD: ${ALERTMANAGER_SMTP_PASSWORD:-}
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - alertmanager_data:/alertmanager
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed -e "s|\$${ALERTMANAGER_SMTP_USER}|$${ALERTMANAGER_SMTP_USER}|g" \
            -e "s|\$${ALERTMANAGER_SMTP_PASSWORD}|$${ALERTMANAGER_SMTP_PASSWORD}|g" \
            /etc/alertmanager/alertmanager.yml.tmpl > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager

    depends_on:
      - prometheus

  aiops-service:
    build:
      context: ./services/aiops-service
    container_name: cloudforge-aiops-service
    environment:
      CLOUDFORGE_INTERNAL_API_TOKEN: ${CLOUDFORGE_INTERNAL_API_TOKEN:?Set CLOUDFORGE_INTERNAL_API_TOKEN in .env}
      DATABASE_URL: postgresql://cloudforge:${POSTGRES_PASSWORD}@postgres:5432/cloudforge
      PROMETHEUS_URL: http://prometheus:9090
      PROMETHEUS_TIMEOUT_SECONDS: "5"
      SLO_WINDOW: "7d"
      SLO_AVAILABILITY_TARGET: "0.999"
      SLO_ERROR_RATE_TARGET: "0.99"
      SLO_LATENCY_TARGET: "0.95"
      SLO_LATENCY_THRESHOLD_MS: "500"
      DEPLOYMENT_SERVICE_URL: http://deployment-service:8082
      DEPLOYMENT_SERVICE_TIMEOUT_SECONDS: "5"

      AI_PROVIDER: mock
      AI_MOCK_MODE: valid
      AI_BASE_URL: ""
      AI_MODEL: ""
      AI_TIMEOUT_SECONDS: "20"


      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
      AWS_CONFIG_FILE: /home/appuser/.aws/config
      AWS_SHARED_CREDENTIALS_FILE: /home/appuser/.aws/credentials

    volumes:
      - ${HOME}/.aws:/home/appuser/.aws:ro

    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  finops-service:
    build:
      context: ./services/finops-service
    image: cloudforge-finops-service:local
    container_name: cloudforge-finops-service
    restart: unless-stopped
    environment:
      CLOUDFORGE_INTERNAL_API_TOKEN: ${CLOUDFORGE_INTERNAL_API_TOKEN:?Set CLOUDFORGE_INTERNAL_API_TOKEN in .env}
      PROMETHEUS_URL: http://prometheus:9090
      PROMETHEUS_TIMEOUT_SECONDS: "5"

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
      AWS_CONFIG_FILE: /home/appuser/.aws/config
      AWS_SHARED_CREDENTIALS_FILE: /home/appuser/.aws/credentials

      FINOPS_ALLOWED_ROLES: "platform-engineer,devops,sre,admin"
    volumes:
      - ${HOME}/.aws:/home/appuser/.aws:ro
    ports:
      - "127.0.0.1:8091:8091"
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cloudforge-frontend:local
    container_name: cloudforge-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_APP_NAME: "CloudForge AI"
      NEXT_PUBLIC_APP_ENV: "production"
      CLOUDFORGE_AUTH_USERNAME: ${CLOUDFORGE_AUTH_USERNAME:?Set CLOUDFORGE_AUTH_USERNAME in .env}
      CLOUDFORGE_AUTH_PASSWORD: ${CLOUDFORGE_AUTH_PASSWORD:?Set CLOUDFORGE_AUTH_PASSWORD in .env}
      CLOUDFORGE_SESSION_SECRET: ${CLOUDFORGE_SESSION_SECRET:?Set CLOUDFORGE_SESSION_SECRET in .env}
      CLOUDFORGE_AUTH_ROLE: ${CLOUDFORGE_AUTH_ROLE:-viewer}
      CLOUDFORGE_AUTH_COOKIE_SECURE: ${CLOUDFORGE_AUTH_COOKIE_SECURE:-false}
      CLOUDFORGE_INTERNAL_API_TOKEN: ${CLOUDFORGE_INTERNAL_API_TOKEN:?Set CLOUDFORGE_INTERNAL_API_TOKEN in .env}
      PROJECT_SERVICE_URL: "http://project-service:8080"
      INFRASTRUCTURE_SERVICE_URL: "http://infrastructure-service:8081"
      DEPLOYMENT_SERVICE_URL: "http://deployment-service:8082"
      AIOPS_SERVICE_URL: "http://aiops-service:8090"
      FINOPS_SERVICE_URL: "http://finops-service:8091"
      PROMETHEUS_URL: "http://prometheus:9090"
      GRAFANA_URL: "http://grafana:3000"
    depends_on:
      - project-service
      - infrastructure-service
      - deployment-service
      - aiops-service
      - finops-service

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  terraform_workspaces:
