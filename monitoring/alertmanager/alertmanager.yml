global:
  resolve_timeout: 5m

  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "${ALERTMANAGER_SMTP_USER}"
  smtp_auth_username: "${ALERTMANAGER_SMTP_USER}"
  smtp_auth_password: "${ALERTMANAGER_SMTP_PASSWORD}"
  smtp_require_tls: true

route:
  group_by:
    - alertname
    - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: email-and-aiops

receivers:
  - name: email-and-aiops
    email_configs:
      - to: "sufiyanmohammed098@gmail.com"
        send_resolved: true

    webhook_configs:
      - url: "http://aiops-service:8090/api/v1/alerts"
        send_resolved: true
