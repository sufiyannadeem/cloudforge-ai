  - expr: "(sum(rate(http_requests_total{namespace=\"cf-fixture\",rollouts_pod_template_hash=\"\
      new\",status=~\"[1-4][0-9][0-9]\"}[5m])) /\n sum(rate(http_requests_total{namespace=\"\
