groups:

  # ============================================================
  # DEPLOYMENT SERVICE OPERATIONAL ALERTS
  # ============================================================

  - name: cloudforge-deployment-service-alerts
    interval: 30s

    rules:

      - alert: DeploymentServiceDown
        expr: up{job="deployment-service"} == 0
        for: 1m

        labels:
          severity: critical
          service: deployment-service
          team: platform

        annotations:
          summary: "Deployment service is down"
          description: "The deployment-service target has been unavailable for more than one minute."
          runbook: "Check deployment-service container logs and container health."

      - alert: DeploymentServiceHighErrorRate
        expr: |
          cloudforge:http_error_rate:5m{
            job="deployment-service"
          } > 0.05
        for: 5m

        labels:
          severity: warning
          service: deployment-service
          team: platform

        annotations:
          summary: "High HTTP 5xx error rate"
          description: "More than 5 percent of deployment-service HTTP requests are returning 5xx responses."
          runbook: "Inspect application logs, dependencies, and recent deployments."

      - alert: DeploymentServiceHighP95Latency
        expr: |
          cloudforge:http_request_latency_p95_seconds:5m{
            job="deployment-service"
          } > 1
        for: 5m

        labels:
          severity: warning
          service: deployment-service
          team: platform

        annotations:
          summary: "High deployment service request latency"
          description: "The deployment-service P95 HTTP latency has exceeded one second for five minutes."
          runbook: "Inspect slow endpoints, database calls, and resource utilization."

      - alert: DeploymentServiceNoRecentTraffic
        expr: |
          cloudforge:http_request_rate:5m{
            job="deployment-service"
          } == 0
        for: 10m

        labels:
          severity: info
          service: deployment-service
          team: platform

        annotations:
          summary: "No recent traffic to deployment service"
          description: "The deployment-service has received no HTTP traffic during the last ten minutes."
          runbook: "Confirm whether the service is expected to receive traffic."

      # ----------------------------------------------------------
      # DEPLOYMENT HEALTH
      # ----------------------------------------------------------

      - alert: CloudForgeDeploymentFailureRateHigh
        expr: |
          cloudforge:deployment_failure_rate:10m{
            job="deployment-service"
          } > 0.10
        for: 5m

        labels:
          severity: warning
          service: deployment-service
          team: platform

        annotations:
          summary: "Deployment failure rate is high"
          description: "More than 10 percent of deployment executions have failed during the last ten minutes."
          runbook: "Inspect deployment logs and executor errors."

      - alert: CloudForgeRepeatedDeploymentFailures
        expr: |
          cloudforge:deployment_failures:15m{
            job="deployment-service"
          } >= 3
        for: 1m

        labels:
          severity: critical
          service: deployment-service
          team: platform

        annotations:
          summary: "Repeated deployment failures detected"
          description: "At least three deployment executions have failed during the last fifteen minutes."
          runbook: "Inspect deployment attempt history and executor failures."

      - alert: CloudForgeHighDeploymentP95Duration
        expr: |
          cloudforge:deployment_duration_p95_seconds:10m{
            job="deployment-service"
          } > 5
        for: 5m

        labels:
          severity: warning
          service: deployment-service
          team: platform

        annotations:
          summary: "Deployment P95 duration is high"
          description: "The P95 deployment execution duration has exceeded five seconds for five minutes."
          runbook: "Inspect executor latency and worker behavior."

      # ============================================================
      # 7-DAY SLO COMPLIANCE
      # ============================================================

      - alert: CloudForgeAvailabilitySLOBreached
        expr: |
          cloudforge:slo_availability:7d{
            job="deployment-service"
          } < 0.999
        for: 10m

        labels:
          severity: warning
          service: deployment-service
          team: platform
          slo: availability

        annotations:
          summary: "Deployment service availability SLO breached"
          description: "7-day observed availability is below the 99.9% SLO target."
          runbook: "Inspect deployment-service health, recent incidents, and Prometheus availability history."

      - alert: CloudForgeRequestSuccessSLOBreached
        expr: |
          cloudforge:slo_request_success:7d{
            job="deployment-service"
          } < 0.99
        for: 10m

        labels:
          severity: warning
          service: deployment-service
          team: platform
          slo: request-success

        annotations:
          summary: "Deployment service request success SLO breached"
          description: "7-day HTTP request success is below the 99% target."
          runbook: "Inspect HTTP 5xx errors, application logs, dependencies, and recent deployments."

      - alert: CloudForgeP95LatencySLOBreached
        expr: |
          cloudforge:slo_latency_compliance:7d{
            job="deployment-service"
          } < 0.95
        for: 10m

        labels:
          severity: warning
          service: deployment-service
          team: platform
          slo: latency

        annotations:
          summary: "Deployment service latency SLO breached"
          description: "Fewer than 95% of requests are completing within 500ms over the seven-day observation window."
          runbook: "Inspect P95 latency, slow endpoints, database calls, and resource utilization."
