name: CloudForge AI SonarQube

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cloudforge_test
          POSTGRES_USER: cloudforge
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cloudforge -d cloudforge_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/project-service/go.mod
          cache: true

      - name: Verify Go version
        run: go version

      - name: Generate project-service coverage
        working-directory: services/project-service
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Generate infrastructure-service coverage
        working-directory: services/infrastructure-service
        env:
          TEST_DATABASE_URL: postgres://cloudforge@localhost:5432/cloudforge_test?sslmode=disable
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Generate deployment-service coverage
        working-directory: services/deployment-service
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Generate AIOps coverage
        working-directory: services/aiops-service
        run: |
          python -m pip install --only-binary=:all: "pip==26.2.1"
          python -m pip install --only-binary=:all: "coverage==7.10.6" "pytest==8.4.2"
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock

          rm -f coverage.xml .coverage

          coverage run --rcfile=../../.coveragerc -m pytest app
          coverage xml --rcfile=../../.coveragerc -o coverage.xml

          sed -i \
            's#filename="app/#filename="services/aiops-service/app/#g' \
            coverage.xml

      - name: Verify coverage reports
        run: |
          test -f services/project-service/coverage.out
          test -f services/infrastructure-service/coverage.out
          test -f services/deployment-service/coverage.out
          test -f services/aiops-service/coverage.xml

          echo "Coverage reports found:"
          ls -lh \
            services/project-service/coverage.out \
            services/infrastructure-service/coverage.out \
            services/deployment-service/coverage.out \
            services/aiops-service/coverage.xml

      - name: SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
