sonar.organization=sufiyannadeem
sonar.projectKey=cloudforge-ai
sonar.projectName=CloudForge AI

# Application source code
sonar.sources=services,frontend/src

# Exclude generated, dependency, documentation, and test files from source analysis.
# Test coverage is imported separately from the Go/Python coverage reports.
sonar.exclusions=\
  **/.venv/**,\
  **/venv/**,\
  **/__pycache__/**,\
  **/node_modules/**,\
  **/.next/**,\
  **/backups/**,\
  **/backup/**,\
  **/server,\
  **/*.sum,\
  **/*.lock,\
  **/docs/**,\
  **/*_test.go,\
  **/test_*.py,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Files excluded from coverage calculations
sonar.coverage.exclusions=\
  **/*_test.go,\
  **/test_*.py,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/docs/**

sonar.sourceEncoding=UTF-8

# Go coverage reports
sonar.go.coverage.reportPaths=\
  services/project-service/coverage.out,\
  services/infrastructure-service/coverage.out,\
  services/deployment-service/coverage.out

# Python coverage report
sonar.python.coverage.reportPaths=services/aiops-service/coverage.xml

# Make the CI job wait for the SonarQube Quality Gate.
# The GitHub Actions job will fail if the configured Quality Gate fails.
sonar.qualitygate.wait=true
